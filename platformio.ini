[env:esp32cam]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    !printf -- '-DFIRMWARE_VERSION=\\"%%s\\"' "$(git describe --always --dirty 2>/dev/null || echo unknown)"

[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
; ESP32のツールチェーンがC++11なので、ホストでも同じ規格で検証する
build_flags = -std=c++11
